<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="45%" stop-color="#0B132B" />
      <stop offset="100%" stop-color="#1C2541" />
    </linearGradient>

    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#7000FF" />
      <stop offset="100%" stop-color="#FF007A" />
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#7000FF" stop-opacity="0.2" />
    </linearGradient>

    <!-- Filter for Glow effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(1.5deg); }
      }
      @keyframes pulseRing {
        0% { r: 120px; opacity: 0.7; }
        50% { r: 150px; opacity: 0.15; }
        100% { r: 120px; opacity: 0.7; }
      }
      @keyframes waveStream {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -1200; }
      }
      @keyframes particleFloat {
        0% { transform: translateY(0) scale(1); opacity: 0.3; }
        50% { transform: translateY(-25px) scale(1.2); opacity: 0.8; }
        100% { transform: translateY(0) scale(1); opacity: 0.3; }
      }
      .anim-float { animation: floatSlow 7s ease-in-out infinite; }
      .anim-wave {
        stroke-dasharray: 40 80;
        animation: waveStream 30s linear infinite;
      }
      .anim-particle-1 { animation: particleFloat 4s ease-in-out infinite; }
      .anim-particle-2 { animation: particleFloat 6s ease-in-out infinite 1.5s; }
      .anim-particle-3 { animation: particleFloat 5s ease-in-out infinite 3s; }
      .anim-pulse { animation: pulseRing 6s ease-in-out infinite; }
      
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        letter-spacing: -0.5px;
      }
      .sub-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
      }
      .tag-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        letter-spacing: 0.5px;
      }
    </style>
  </defs>

  <!-- BACKGROUND LAYER -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />

  <!-- DYNAMIC / ANIMATED BACKGROUND ELEMENTS (Underneath text) -->
  <g opacity="0.25">
    <!-- Cyber Grid -->
    <path d="M 0 70 L 1200 70 M 0 140 L 1200 140 M 0 210 L 1200 210 M 0 280 L 1200 280 M 0 350 L 1200 350" stroke="#00F0FF" stroke-width="0.5" stroke-dasharray="4 8" />
    <path d="M 120 0 L 120 420 M 240 0 L 240 420 M 360 0 L 360 420 M 480 0 L 480 420 M 600 0 L 600 420 M 720 0 L 720 420 M 840 0 L 840 420 M 960 0 L 960 420 M 1080 0 L 1080 420" stroke="#00F0FF" stroke-width="0.5" stroke-dasharray="4 8" />
  </g>

  <!-- Ambient Light Orbs -->
  <circle cx="150" cy="90" r="140" fill="#00F0FF" filter="url(#glow)" opacity="0.12" />
  <circle cx="1050" cy="330" r="160" fill="#7000FF" filter="url(#glow)" opacity="0.15" />
  <circle cx="980" cy="110" r="100" fill="#FF007A" filter="url(#glow)" opacity="0.1" />

  <!-- Dynamic Cryptographic Data Waves -->
  <path class="anim-wave" d="M -100 80 Q 250 180 600 90 T 1300 120" fill="none" stroke="#00F0FF" stroke-width="1.5" opacity="0.35" />
  <path class="anim-wave" d="M -100 340 Q 300 260 700 350 T 1300 290" fill="none" stroke="#7000FF" stroke-width="1.5" opacity="0.35" style="animation-duration: 24s; animation-direction: reverse;" />

  <!-- Animated Background Security Rings (Far Right) -->
  <g transform="translate(1030, 210)" opacity="0.5">
    <circle class="anim-pulse" cx="0" cy="0" r="120" fill="none" stroke="#00F0FF" stroke-width="1.5" stroke-dasharray="6 6" />
    <circle cx="0" cy="0" r="85" fill="none" stroke="#7000FF" stroke-width="1" stroke-dasharray="3 3" />
    <!-- Lock Graphic Behind/Right -->
    <path d="M -24 -10 L -24 -26 C -24 -39 -14 -49 0 -49 C 14 -49 24 -39 24 -26 L 24 -10 Z" fill="none" stroke="#00F0FF" stroke-width="4" stroke-linecap="round" />
    <rect x="-35" y="-10" width="70" height="60" rx="10" fill="url(#shieldGrad)" stroke="#00F0FF" stroke-width="3" filter="url(#subtleGlow)" />
    <circle cx="0" cy="14" r="6" fill="#00F0FF" />
    <path d="M 0 20 L 0 32" stroke="#00F0FF" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Ambient Floating Crypto Particles -->
  <g opacity="0.6">
    <circle class="anim-particle-1" cx="220" cy="80" r="3" fill="#00F0FF" />
    <circle class="anim-particle-2" cx="80" cy="260" r="2.5" fill="#FF007A" />
    <circle class="anim-particle-3" cx="540" cy="45" r="3.5" fill="#7000FF" />
    <circle class="anim-particle-1" cx="880" cy="65" r="2" fill="#00F0FF" />
    <circle class="anim-particle-2" cx="720" cy="370" r="3" fill="#00F0FF" />
  </g>

  <!-- FOREGROUND LAYER - Guaranteed Crisp, Clear & Always on Top -->
  <g transform="translate(80, 0)">
    <!-- Top Category Pill -->
    <g transform="translate(0, 72)">
      <rect x="0" y="0" width="310" height="32" rx="16" fill="#111B33" stroke="#00F0FF" stroke-width="1.2" filter="url(#subtleGlow)" />
      <circle cx="16" cy="16" r="5" fill="#00F0FF" />
      <text x="32" y="21" fill="#00F0FF" class="tag-text">CURATED REPOSITORY • E2EE DIRECTORY</text>
    </g>

    <!-- Main Title -->
    <g transform="translate(0, 160)">
      <text x="0" y="0" fill="#FFFFFF" font-size="46" class="title-text" filter="url(#subtleGlow)">
        Awesome Encrypted Note Taking
      </text>
      <!-- Gradient Accent Underline -->
      <rect x="0" y="16" width="460" height="4" rx="2" fill="url(#neonGlow)" />
    </g>

    <!-- Subtitle -->
    <g transform="translate(0, 222)">
      <text x="0" y="0" fill="#94A3B8" font-size="20" class="sub-text">
        The Definitive Guide to End-to-End Encrypted (E2EE), Zero-Knowledge,
      </text>
      <text x="0" y="28" fill="#CBD5E1" font-size="20" class="sub-text" font-weight="500">
        Local-First &amp; Privacy-Centric Note Management Ecosystems
      </text>
    </g>

    <!-- Interactive / Status Badges in Foreground -->
    <g transform="translate(0, 310)">
      <!-- Badge 1: E2EE -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="160" height="38" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1.5" />
        <rect x="0" y="0" width="5" height="38" rx="2" fill="#00F0FF" />
        <text x="20" y="24" fill="#E2E8F0" class="tag-text">🔒 Zero-Knowledge</text>
      </g>

      <!-- Badge 2: Local First -->
      <g transform="translate(175, 0)">
        <rect x="0" y="0" width="145" height="38" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1.5" />
        <rect x="0" y="0" width="5" height="38" rx="2" fill="#7000FF" />
        <text x="20" y="24" fill="#E2E8F0" class="tag-text">📂 Local-First</text>
      </g>

      <!-- Badge 3: Audited / OSS -->
      <g transform="translate(335, 0)">
        <rect x="0" y="0" width="165" height="38" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1.5" />
        <rect x="0" y="0" width="5" height="38" rx="2" fill="#10B981" />
        <text x="20" y="24" fill="#E2E8F0" class="tag-text">🛡️ Audited Protocols</text>
      </g>

      <!-- Badge 4: Multi-platform -->
      <g transform="translate(515, 0)">
        <rect x="0" y="0" width="180" height="38" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1.5" />
        <rect x="0" y="0" width="5" height="38" rx="2" fill="#EC4899" />
        <text x="20" y="24" fill="#E2E8F0" class="tag-text">⚡ SaaS &amp; Open Source</text>
      </g>
    </g>
  </g>
</svg>
